<!DOCTYPE html>
<html lang="ja">
<!-- 
  Build Trigger: 2026-05-04-BackToBasics-TopUI
  Fix: UI disappearing due to bottom address bar
  Design: Top-aligned controls to ensure visibility
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web Cam Pro v2.5</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; height: 100vh; width: 100vw; }
        
        /* プレビューは画面全体 */
        #viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: contain; }
        #frame-layer { position: absolute; top: 0; left: 0; will-change: transform; touch-action: none; z-index: 10; }
        #frame-img { display: none; pointer-events: none; }

        /* UIを画面上部に配置（下部バーの影響を完全に回避） */
        .controls { 
            position: absolute; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(0, 0, 0, 0.7); 
            padding: 15px; 
            border-radius: 16px;
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            z-index: 100; 
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .button-group { display: flex; gap: 10px; }
        .slider-group { display: none; align-items: center; gap: 10px; color: white; font-size: 10px; }
        
        button, label { 
            background: #333; color: white; border: 1px solid #555; 
            padding: 12px; border-radius: 8px; font-size: 13px; 
            cursor: pointer; flex: 1; text-align: center;
        }
        #shutter { background: #d63031; border: none; font-weight: bold; flex: 1.5; }
        input[type="range"] { flex: 1; accent-color: #f1c40f; }
        input[type="file"] { display: none; }
        canvas { display: none; }
    </style>
</head>
<body>

<div id="viewport">
    <video id="video" autoplay playsinline></video>
    <div id="frame-layer"><img id="frame-img" src=""></div>
</div>

<div class="controls">
    <div id="exposure-ui" class="slider-group">
        <span>BRIGHTNESS</span>
        <input type="range" id="exposure-slider" step="0.1">
    </div>
    <div class="button-group">
        <label for="file-input">PNG選択</label>
        <input type="file" id="file-input" accept="image/png">
        <button id="shutter">撮影</button>
    </div>
</div>

<canvas id="canvas-output"></canvas>

<script>
    const video = document.getElementById('video');
    const frameLayer = document.getElementById('frame-layer');
    const frameImg = document.getElementById('frame-img');
    const exposureUI = document.getElementById('exposure-ui');
    const exposureSlider = document.getElementById('exposure-slider');
    const canvas = document.getElementById('canvas-output');

    let videoTrack = null;
    let state = { x: 50, y: 150, scale: 0.5, lastX: 0, lastY: 0, lastDist: 0 };

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
            const caps = videoTrack.getCapabilities();
            if (caps.exposureCompensation) {
                exposureUI.style.display = 'flex';
                exposureSlider.min = caps.exposureCompensation.min;
                exposureSlider.max = caps.exposureCompensation.max;
                exposureSlider.value = 0;
            }
        } catch (err) { alert("Camera Error: " + err); }
    }

    exposureSlider.addEventListener('input', (e) => {
        if (videoTrack) videoTrack.applyConstraints({ advanced: [{ exposureCompensation: parseFloat(e.target.value) }] });
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            frameImg.src = ev.target.result;
            frameImg.style.display = 'block';
            frameImg.onload = () => {
                state.scale = (window.innerWidth / frameImg.naturalWidth) * 0.6;
                updateTransform();
            };
        };
        reader.readAsDataURL(e.target.files[0]);
    });

    frameLayer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            state.lastX = e.touches[0].clientX - state.x;
            state.lastY = e.touches[0].clientY - state.y;
        } else if (e.touches.length === 2) {
            state.lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
    });

    frameLayer.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
            state.x = e.touches[0].clientX - state.lastX;
            state.y = e.touches[0].clientY - state.lastY;
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            state.scale *= (dist / state.lastDist);
            state.lastDist = dist;
        }
        updateTransform();
    }, { passive: false });

    function updateTransform() {
        frameLayer.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    }

    document.getElementById('shutter').addEventListener('click', () => {
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const rect = video.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        if (frameImg.src) {
            ctx.drawImage(frameImg, (state.x - rect.left) * scaleX, (state.y - rect.top) * scaleY, 
                          frameImg.naturalWidth * state.scale * scaleX, frameImg.naturalHeight * state.scale * scaleY);
        }
        const link = document.createElement('a');
        link.download = `shot-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });

    window.onload = startCamera;
</script>
</body>
</html>
