<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web Camera Frame Tool v2</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* プレビューエリア */
        #viewport {
            position: relative;
            flex-grow: 1;
            width: 100vw;
            overflow: hidden;
            background: #111;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 画面に収まるように表示 */
        }

        /* フレーム重畳レイヤー */
        #frame-layer {
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
            touch-action: none;
            cursor: move;
            display: inline-block;
        }

        #frame-img {
            display: none;
            pointer-events: none; /* タッチイベントは親のdivで取る */
        }

        /* 操作パネル */
        .controls {
            background: #222;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 100;
        }

        button, label {
            background: #444;
            color: white;
            border: 1px solid #666;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }

        #shutter {
            background: #e74c3c;
            border-color: #c0392b;
            font-weight: bold;
            padding: 12px 40px;
        }

        input[type="file"] {
            display: none;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>

<div id="viewport">
    <video id="video" autoplay playsinline></video>
    <div id="frame-layer">
        <img id="frame-img" src="" alt="Frame">
    </div>
</div>

<div class="controls">
    <label for="file-input">PNG選択</label>
    <input type="file" id="file-input" accept="image/png">
    <button id="shutter">写真を保存</button>
</div>

<canvas id="canvas-output"></canvas>

<script>
    const video = document.getElementById('video');
    const frameLayer = document.getElementById('frame-layer');
    const frameImg = document.getElementById('frame-img');
    const fileInput = document.getElementById('file-input');
    const shutter = document.getElementById('shutter');
    const canvas = document.getElementById('canvas-output');

    let state = { x: 50, y: 50, scale: 0.5, lastX: 0, lastY: 0, lastDist: 0 };
    let isDragging = false;

    // 1. カメラ起動
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
                audio: false
            });
            video.srcObject = stream;
        } catch (err) {
            alert("カメラを起動できません: " + err);
        }
    }

    // 2. フレーム画像読み込み
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            frameImg.src = event.target.result;
            frameImg.style.display = 'block';
            frameImg.onload = () => {
                state.scale = (window.innerWidth / frameImg.naturalWidth) * 0.8;
                updateTransform();
            };
        };
        reader.readAsDataURL(file);
    });

    // 3. タッチ操作
    frameLayer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            isDragging = true;
            state.lastX = e.touches[0].clientX - state.x;
            state.lastY = e.touches[0].clientY - state.y;
        } else if (e.touches.length === 2) {
            state.lastDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }
    });

    frameLayer.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (isDragging && e.touches.length === 1) {
            state.x = e.touches[0].clientX - state.lastX;
            state.y = e.touches[0].clientY - state.lastY;
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            const delta = dist / state.lastDist;
            state.scale *= delta;
            state.lastDist = dist;
        }
        updateTransform();
    }, { passive: false });

    frameLayer.addEventListener('touchend', () => isDragging = false);

    function updateTransform() {
        frameLayer.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    }

    // 4. 合成と保存
    shutter.addEventListener('click', () => {
        if (!frameImg.src) {
            alert("先にフレーム画像を選択してください");
            return;
        }

        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // ビデオの表示サイズと実際の解像度の比率を計算
        const rect = video.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        // ビデオ内の実際の表示オフセット（object-fit: containによる余白対策）
        const offsetX = (rect.width - video.offsetWidth) / 2;
        const offsetY = (rect.height - video.offsetHeight) / 2;

        // 描画
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const drawX = (state.x - rect.left) * scaleX;
        const drawY = (state.y - rect.top) * scaleY;
        const drawW = frameImg.naturalWidth * state.scale * scaleX;
        const drawH = frameImg.naturalHeight * state.scale * scaleY;

        ctx.drawImage(frameImg, drawX, drawY, drawW, drawH);

        // 保存
        const link = document.createElement('a');
        link.download = `web-photo-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });

    window.onload = startCamera;
</script>
</body>
</html>
