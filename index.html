<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web Photo Editor v5.0</title>
    <style>
        :root { --app-height: 100vh; }
        html, body { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            margin: 0; padding: 0; overflow: hidden; 
            background: #000; color: white;
            display: flex; flex-direction: column;
            height: var(--app-height); font-family: sans-serif;
        }

        #viewport { 
            flex: 1; position: relative; width: 100%; 
            background: #111; overflow: hidden; z-index: 1;
        }
        video, #base-img { 
            width: 100%; height: 100%; object-fit: contain; 
            position: absolute; top: 0; left: 0;
        }
        #base-img { display: none; z-index: 2; }

        #frame-layer { 
            position: absolute; top: 0; left: 0; 
            will-change: transform; touch-action: none; 
            z-index: 10; display: none; transform-origin: 0 0;
        }
        #frame-img { 
            display: block; pointer-events: none; 
            transform-origin: center center;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .controls { 
            height: 180px; background: #1a1a1a; 
            display: flex; flex-direction: column; justify-content: center;
            padding: 0 15px calc(env(safe-area-inset-bottom) + 5px);
            z-index: 100; border-top: 1px solid #333;
        }

        .button-group { display: flex; gap: 8px; height: 50px; margin-bottom: 8px; }
        .shutter-group { display: flex; gap: 8px; height: 60px; }
        
        button, label { 
            display: flex; align-items: center; justify-content: center;
            background: #333; color: white; border: 1px solid #555; 
            border-radius: 12px; font-size: 13px; font-weight: bold;
            flex: 1; cursor: pointer; text-align: center;
        }
        #shutter { background: #e74c3c; border: none; flex: 2; font-size: 16px; }
        #reset-btn { background: #555; flex: 0.8; }
        
        #exposure-ui { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; height: 24px; visibility: hidden; }
        input[type="range"] { flex: 1; accent-color: #f1c40f; }
        input[type="file"] { display: none; }

        canvas { display: none; }
    </style>
</head>
<body>

<div id="viewport">
    <video id="video" autoplay playsinline></video>
    <img id="base-img">
    <div id="frame-layer"><img id="frame-img" src=""></div>
</div>

<div class="controls">
    <div id="exposure-ui">
        <span style="font-size:10px; color:#aaa;">BRIGHT</span>
        <input type="range" id="exposure-slider" step="0.1">
    </div>
    
    <div class="button-group">
        <label for="base-input">背景写真</label>
        <input type="file" id="base-input" accept="image/*">
        
        <label for="frame-input">PNGフレーム</label>
        <input type="file" id="frame-input" accept="image/png">
    </div>

    <div class="shutter-group">
        <button id="reset-btn">リセット</button>
        <button id="shutter">保存(JPG)</button>
    </div>
</div>

<canvas id="canvas-output"></canvas>

<script>
    function lockHeight() { document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`); }
    window.addEventListener('resize', lockHeight);
    lockHeight();

    const video = document.getElementById('video');
    const baseImg = document.getElementById('base-img');
    const frameLayer = document.getElementById('frame-layer');
    const frameImg = document.getElementById('frame-img');
    const exposureUI = document.getElementById('exposure-ui');
    const exposureSlider = document.getElementById('exposure-slider');
    const canvas = document.getElementById('canvas-output');
    const viewport = document.getElementById('viewport');

    let videoTrack = null;
    let currentRotation = 0; 
    let isPhotoMode = false;
    let state = { x: 0, y: 0, scale: 1, lastX: 0, lastY: 0, lastDist: 0 };

    // カメラ起動
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
            const caps = videoTrack.getCapabilities();
            if (caps.exposureCompensation) {
                exposureUI.style.visibility = 'visible';
                exposureSlider.min = caps.exposureCompensation.min;
                exposureSlider.max = caps.exposureCompensation.max;
                exposureSlider.value = 0;
            }
        } catch (err) { console.error(err); }
    }

    // 背景写真の読み込み
    document.getElementById('base-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            baseImg.src = ev.target.result;
            baseImg.style.display = 'block';
            video.style.display = 'none';
            isPhotoMode = true;
            exposureUI.style.visibility = 'hidden';
        };
        reader.readAsDataURL(file);
    });

    // フレームPNGの読み込み
    document.getElementById('frame-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            frameImg.src = ev.target.result;
            frameImg.onload = () => {
                const vW = viewport.clientWidth;
                const vH = viewport.clientHeight;
                state.scale = (vW * 0.7) / frameImg.naturalWidth;
                state.x = (vW - (frameImg.naturalWidth * state.scale)) / 2;
                state.y = (vH - (frameImg.naturalHeight * state.scale)) / 2;
                frameLayer.style.display = 'block';
                updateTransform();
            };
        };
        reader.readAsDataURL(file);
    });

    // リセットボタン（カメラに戻る）
    document.getElementById('reset-btn').addEventListener('click', () => {
        baseImg.style.display = 'none';
        video.style.display = 'block';
        isPhotoMode = false;
        if(videoTrack) exposureUI.style.visibility = 'visible';
    });

    function handleOrientation() {
        currentRotation = -(window.orientation || 0);
        updateTransform();
    }
    window.addEventListener("orientationchange", handleOrientation);

    // タッチ操作
    viewport.addEventListener('touchstart', (e) => {
        if (!e.target.closest('#frame-layer')) return;
        if (e.touches.length === 1) {
            state.lastX = e.touches[0].clientX - state.x;
            state.lastY = e.touches[0].clientY - state.y;
        } else if (e.touches.length === 2) {
            state.lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
    });

    viewport.addEventListener('touchmove', (e) => {
        if (!e.target.closest('#frame-layer')) return;
        e.preventDefault();
        if (e.touches.length === 1) {
            state.x = e.touches[0].clientX - state.lastX;
            state.y = e.touches[0].clientY - state.lastY;
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            state.scale *= (dist / state.lastDist);
            state.lastDist = dist;
        }
        updateTransform();
    }, { passive: false });

    function updateTransform() {
        frameImg.style.transform = `rotate(${currentRotation}deg)`;
        frameLayer.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    }

    exposureSlider.addEventListener('input', (e) => {
        if (videoTrack) videoTrack.applyConstraints({ advanced: [{ exposureCompensation: parseFloat(e.target.value) }] });
    });

    // 合成保存
    document.getElementById('shutter').addEventListener('click', () => {
        const ctx = canvas.getContext('2d');
        const targetEl = isPhotoMode ? baseImg : video;
        const sourceW = isPhotoMode ? baseImg.naturalWidth : video.videoWidth;
        const sourceH = isPhotoMode ? baseImg.naturalHeight : video.videoHeight;

        canvas.width = sourceW;
        canvas.height = sourceH;

        const vW = targetEl.offsetWidth;
        const vH = targetEl.offsetHeight;
        const rect = targetEl.getBoundingClientRect();
        const ratio = sourceW / sourceH;
        const elRatio = vW / vH;

        let realW, realH, realX, realY;
        if (elRatio > ratio) { realH = vH; realW = vH * ratio; } 
        else { realW = vW; realH = vW / ratio; }
        realX = rect.left + (vW - realW) / 2;
        realY = rect.top + (vH - realH) / 2;

        const s = sourceW / realW;

        // 背景描画
        ctx.drawImage(targetEl, 0, 0, sourceW, sourceH);

        // フレーム描画
        if (frameImg.src && frameLayer.style.display !== 'none') {
            ctx.save();
            const drawW = (frameImg.naturalWidth * state.scale) * s;
            const drawH = (frameImg.naturalHeight * state.scale) * s;
            const centerX = (state.x - realX) * s + drawW / 2;
            const centerY = (state.y - realY) * s + drawH / 2;
            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation * Math.PI / 180);
            ctx.drawImage(frameImg, -drawW / 2, -drawH / 2, drawW, drawH);
            ctx.restore();
        }

        const link = document.createElement('a');
        link.download = `edit_${Date.now()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    });

    window.onload = () => { startCamera(); handleOrientation(); };
</script>
</body>
</html>
