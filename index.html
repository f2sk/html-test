<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Cam Fixed v3.0</title>
    <style>
        /* 100vhに頼らず、html/bodyを強制的に画面いっぱいに広げる */
        html, body { 
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            margin: 0; padding: 0; overflow: hidden; 
            background: #000; color: white;
            display: flex; flex-direction: column;
        }

        /* プレビューエリア：残りの高さを全部使う */
        #viewport { 
            flex: 1;
            position: relative; 
            width: 100%; 
            background: #111;
            overflow: hidden;
            z-index: 1;
        }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* フレーム：初期は隠すが、JSエラーでもボタンには影響しない位置 */
        #frame-layer { 
            position: absolute; top: 0; left: 0; 
            will-change: transform; touch-action: none; 
            z-index: 10; display: none; transform-origin: 0 0;
        }
        #frame-img { display: block; pointer-events: none; }

        /* 操作パネル：確実に「下」に150px確保する */
        .controls { 
            height: 160px; /* 高さを固定して確保 */
            background: #1a1a1a; 
            display: flex; flex-direction: column;
            justify-content: center;
            padding: 0 20px;
            z-index: 100;
            border-top: 2px solid #444;
        }

        .button-group { display: flex; gap: 10px; height: 60px; align-items: center; }
        
        button, label { 
            display: block;
            background: #444; color: white; border: 2px solid #666; 
            border-radius: 12px; font-size: 16px; font-weight: bold;
            height: 50px; line-height: 50px;
            cursor: pointer; flex: 1; text-align: center;
        }
        #shutter { background: #d63031; border: none; flex: 1.5; }
        
        #exposure-ui { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; height: 30px; visibility: hidden; }
        input[type="range"] { flex: 1; height: 30px; }

        /* デバッグ用エラー表示 */
        #debug-log {
            position: absolute; top: 0; left: 0; width: 100%; 
            background: rgba(255,0,0,0.7); color: white; font-size: 10px; z-index: 999;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="debug-log"></div>

<div id="viewport">
    <video id="video" autoplay playsinline></video>
    <div id="frame-layer"><img id="frame-img" src=""></div>
</div>

<div class="controls">
    <div id="exposure-ui">
        <span style="font-size:10px">BRIGHT</span>
        <input type="range" id="exposure-slider" step="0.1">
    </div>
    <div class="button-group">
        <label for="file-input">PNG選択</label>
        <input type="file" id="file-input" accept="image/png">
        <button id="shutter">撮影(JPG)</button>
    </div>
</div>

<canvas id="canvas-output" style="display:none;"></canvas>

<script>
    const log = (msg) => { document.getElementById('debug-log').innerText += msg + "\n"; };
    
    // エラーハンドリング
    window.onerror = (m, u, l) => log(`Error: ${m} at line ${l}`);

    const video = document.getElementById('video');
    const frameLayer = document.getElementById('frame-layer');
    const frameImg = document.getElementById('frame-img');
    const exposureUI = document.getElementById('exposure-ui');
    const exposureSlider = document.getElementById('exposure-slider');
    const canvas = document.getElementById('canvas-output');
    const viewport = document.getElementById('viewport');

    let videoTrack = null;
    let state = { x: 0, y: 0, scale: 1, lastX: 0, lastY: 0, lastDist: 0 };

    async function init() {
        log("Checking devices...");
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
            
            const caps = videoTrack.getCapabilities();
            if (caps.exposureCompensation) {
                exposureUI.style.visibility = 'visible';
                exposureSlider.min = caps.exposureCompensation.min;
                exposureSlider.max = caps.exposureCompensation.max;
                exposureSlider.value = 0;
            }
            log("Camera OK");
        } catch (err) {
            log("Camera Error: " + err.message);
        }
    }

    // PNG選択時の処理
    document.getElementById('file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            frameImg.src = ev.target.result;
            frameImg.onload = () => {
                const vW = viewport.clientWidth;
                const vH = viewport.clientHeight;
                state.scale = (vW * 0.8) / frameImg.naturalWidth;
                state.x = (vW - (frameImg.naturalWidth * state.scale)) / 2;
                state.y = (vH - (frameImg.naturalHeight * state.scale)) / 2;
                frameLayer.style.display = 'block';
                updateTransform();
            };
        };
        reader.readAsDataURL(file);
    });

    // タッチイベント
    viewport.addEventListener('touchstart', (e) => {
        if (e.target.closest('#frame-layer')) {
            if (e.touches.length === 1) {
                state.lastX = e.touches[0].clientX - state.x;
                state.lastY = e.touches[0].clientY - state.y;
            } else if (e.touches.length === 2) {
                state.lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        }
    });

    viewport.addEventListener('touchmove', (e) => {
        if (!e.target.closest('#frame-layer')) return;
        e.preventDefault();
        if (e.touches.length === 1) {
            state.x = e.touches[0].clientX - state.lastX;
            state.y = e.touches[0].clientY - state.lastY;
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            state.scale *= (dist / state.lastDist);
            state.lastDist = dist;
        }
        updateTransform();
    }, { passive: false });

    function updateTransform() {
        frameLayer.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    }

    exposureSlider.addEventListener('input', (e) => {
        if (videoTrack) videoTrack.applyConstraints({ advanced: [{ exposureCompensation: parseFloat(e.target.value) }] });
    });

    // 撮影合成
    document.getElementById('shutter').addEventListener('click', () => {
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const vW = video.offsetWidth;
        const vH = video.offsetHeight;
        const rect = video.getBoundingClientRect();
        const videoRatio = canvas.width / canvas.height;
        const elementRatio = vW / vH;
        let realW, realH, realX, realY;

        if (elementRatio > videoRatio) {
            realH = vH; realW = vH * videoRatio;
        } else {
            realW = vW; realH = vW / videoRatio;
        }
        realX = rect.left + (vW - realW) / 2;
        realY = rect.top + (vH - realH) / 2;

        const s = canvas.width / realW;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (frameImg.src && frameLayer.style.display !== 'none') {
            ctx.drawImage(frameImg, (state.x - realX) * s, (state.y - realY) * s, 
                          (frameImg.naturalWidth * state.scale) * s, (frameImg.naturalHeight * state.scale) * s);
        }

        const link = document.createElement('a');
        link.download = `photo_${Date.now()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    });

    // 起動
    init();
</script>
</body>
</html>
