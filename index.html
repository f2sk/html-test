<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web Cam Pro v2.7</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; height: 100vh; width: 100vw; }
        
        /* ビデオとフレームのコンテナ */
        #viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* フレームレイヤー：初期は非表示 */
        #frame-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            will-change: transform; 
            touch-action: none; 
            z-index: 10; 
            display: none;
            transform-origin: 0 0; /* 左上を起点に制御 */
        }
        #frame-img { display: block; pointer-events: none; }

        /* 操作UI：上部に固定 */
        .controls { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            background: rgba(0, 0, 0, 0.8); 
            padding: 15px; 
            border-radius: 16px;
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            z-index: 100; 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .button-group { display: flex; gap: 10px; }
        .slider-group { display: none; align-items: center; gap: 10px; color: white; font-size: 11px; }
        
        button, label { 
            background: #444; color: white; border: 1px solid #666; 
            padding: 12px; border-radius: 10px; font-size: 13px; 
            cursor: pointer; flex: 1; text-align: center;
        }
        #shutter { background: #e74c3c; border: none; font-weight: bold; flex: 1.5; }
        input[type="range"] { flex: 1; accent-color: #f1c40f; }
        input[type="file"] { display: none; }
        canvas { display: none; }
    </style>
</head>
<body>

<div id="viewport">
    <video id="video" autoplay playsinline></video>
    <div id="frame-layer"><img id="frame-img" src=""></div>
</div>

<div class="controls">
    <div id="exposure-ui" class="slider-group">
        <span>BRIGHTNESS</span>
        <input type="range" id="exposure-slider" step="0.1">
    </div>
    <div class="button-group">
        <label for="file-input">PNG選択</label>
        <input type="file" id="file-input" accept="image/png">
        <button id="shutter">撮影</button>
    </div>
</div>

<canvas id="canvas-output"></canvas>

<script>
    const video = document.getElementById('video');
    const frameLayer = document.getElementById('frame-layer');
    const frameImg = document.getElementById('frame-img');
    const exposureUI = document.getElementById('exposure-ui');
    const exposureSlider = document.getElementById('exposure-slider');
    const canvas = document.getElementById('canvas-output');

    let videoTrack = null;
    let state = { x: 0, y: 0, scale: 1, lastX: 0, lastY: 0, lastDist: 0 };

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
            const caps = videoTrack.getCapabilities();
            if (caps.exposureCompensation) {
                exposureUI.style.display = 'flex';
                exposureSlider.min = caps.exposureCompensation.min;
                exposureSlider.max = caps.exposureCompensation.max;
                exposureSlider.value = 0;
            }
        } catch (err) { alert("Camera Error: " + err); }
    }

    // PNG読み込み：真ん中に配置
    document.getElementById('file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            frameImg.src = ev.target.result;
            frameImg.onload = () => {
                // 画面に収まるようにスケールを計算 (80%幅に)
                const scale = (window.innerWidth * 0.8) / frameImg.naturalWidth;
                state.scale = scale;

                // ど真ん中に配置
                state.x = (window.innerWidth - (frameImg.naturalWidth * state.scale)) / 2;
                state.y = (window.innerHeight - (frameImg.naturalHeight * state.scale)) / 2;

                frameLayer.style.display = 'block';
                updateTransform();
            };
        };
        reader.readAsDataURL(file);
    });

    // タッチ操作（移動・ピンチ）
    frameLayer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            state.lastX = e.touches[0].clientX - state.x;
            state.lastY = e.touches[0].clientY - state.y;
        } else if (e.touches.length === 2) {
            state.lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
    });

    frameLayer.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
            state.x = e.touches[0].clientX - state.lastX;
            state.y = e.touches[0].clientY - state.lastY;
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            const delta = dist / state.lastDist;
            state.scale *= delta;
            state.lastDist = dist;
        }
        updateTransform();
    }, { passive: false });

    function updateTransform() {
        // transform-origin: 0 0 なので translate だけで位置が決まる
        frameLayer.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    }

    // 明度調整
    exposureSlider.addEventListener('input', (e) => {
        if (videoTrack) videoTrack.applyConstraints({ advanced: [{ exposureCompensation: parseFloat(e.target.value) }] });
    });

    // 合成保存（修正：ビデオの表示領域と実際の解像度を計算）
    document.getElementById('shutter').addEventListener('click', () => {
        const ctx = canvas.getContext('2d');
        
        // カメラの実際の解像度をセット
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // 1. まずカメラ映像を描画
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 2. フレームを合成
        if (frameImg.src && frameLayer.style.display !== 'none') {
            const vRect = video.getBoundingClientRect();
            
            // 画面上のビデオ表示エリアに対するピクセル比率
            // object-fit: contain のため、video要素のサイズと実際の映像表示位置を考慮
            const scaleX = canvas.width / vRect.width;
            const scaleY = canvas.height / vRect.height;

            // 画面座標からCanvas座標への変換
            const drawX = (state.x - vRect.left) * scaleX;
            const drawY = (state.y - vRect.top) * scaleY;
            const drawW = frameImg.naturalWidth * state.scale * scaleX;
            const drawH = frameImg.naturalHeight * state.scale * scaleY;

            ctx.drawImage(frameImg, drawX, drawY, drawW, drawH);
        }

        // 3. 保存
        const link = document.createElement('a');
        link.download = `photo-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });

    window.onload = startCamera;
</script>
</body>
</html>
