<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web Cam Tool Final</title>
    <style>
        :root {
            /* 下部バー対策: env()が取れない場合も考慮しつつ十分な余白を確保 */
            --safe-bottom: env(safe-area-inset-bottom, 24px);
        }
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: system-ui, sans-serif; 
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
        }
        
        /* プレビューエリア */
        #viewport { 
            position: relative; 
            flex-grow: 1; 
            width: 100%; 
            background: #111; 
            overflow: hidden; 
        }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* フレーム：z-indexを明示 */
        #frame-layer { 
            position: absolute; 
            top: 0; left: 0; 
            will-change: transform; 
            touch-action: none; 
            z-index: 10; 
            display: none;
            transform-origin: 0 0;
        }
        #frame-img { display: block; pointer-events: none; }

        /* 操作パネル：最下部に固定 */
        .controls { 
            background: rgba(20, 20, 20, 0.9); 
            padding: 15px 20px calc(var(--safe-bottom) + 15px); 
            z-index: 100;
            border-top: 1px solid #333;
            backdrop-filter: blur(15px);
        }

        .slider-group { 
            display: none; align-items: center; gap: 15px; 
            color: #ccc; font-size: 11px; margin-bottom: 15px; 
        }
        .button-group { display: flex; gap: 12px; }
        
        button, label { 
            background: #333; color: white; border: 1px solid #555; 
            padding: 15px; border-radius: 14px; font-size: 14px; 
            cursor: pointer; flex: 1; text-align: center; font-weight: 500;
        }
        #shutter { background: #e74c3c; border: none; flex: 1.5; }
        input[type="range"] { flex: 1; accent-color: #f1c40f; }
        input[type="file"] { display: none; }
        canvas { display: none; }
    </style>
</head>
<body>

<div id="viewport">
    <video id="video" autoplay playsinline></video>
    <div id="frame-layer"><img id="frame-img" src=""></div>
</div>

<div class="controls">
    <div id="exposure-ui" class="slider-group">
        <span>BRIGHTNESS</span>
        <input type="range" id="exposure-slider" step="0.1">
    </div>
    <div class="button-group">
        <label for="file-input">PNG選択</label>
        <input type="file" id="file-input" accept="image/png">
        <button id="shutter">撮影(JPEG)</button>
    </div>
</div>

<canvas id="canvas-output"></canvas>

<script>
    const video = document.getElementById('video');
    const frameLayer = document.getElementById('frame-layer');
    const frameImg = document.getElementById('frame-img');
    const exposureUI = document.getElementById('exposure-ui');
    const exposureSlider = document.getElementById('exposure-slider');
    const canvas = document.getElementById('canvas-output');
    const viewport = document.getElementById('viewport');

    let videoTrack = null;
    let state = { x: 0, y: 0, scale: 1, lastX: 0, lastY: 0, lastDist: 0 };

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
            
            const caps = videoTrack.getCapabilities();
            if (caps.exposureCompensation) {
                exposureUI.style.display = 'flex';
                exposureSlider.min = caps.exposureCompensation.min;
                exposureSlider.max = caps.exposureCompensation.max;
                exposureSlider.value = 0;
            }
        } catch (err) { alert("Camera Error: " + err); }
    }

    // 1. PNG読み込み & 中央初期化
    document.getElementById('file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            frameImg.src = ev.target.result;
            frameImg.onload = () => {
                const viewW = viewport.clientWidth;
                const viewH = viewport.clientHeight;
                
                // 初期スケール：画面の60%幅に収める
                state.scale = (viewW * 0.6) / frameImg.naturalWidth;
                
                // 初期位置：プレビューエリアの真ん中
                state.x = (viewW - (frameImg.naturalWidth * state.scale)) / 2;
                state.y = (viewH - (frameImg.naturalHeight * state.scale)) / 2;

                frameLayer.style.display = 'block';
                updateTransform();
            };
        };
        reader.readAsDataURL(file);
    });

    // 2. 操作
    frameLayer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            state.lastX = e.touches[0].clientX - state.x;
            state.lastY = e.touches[0].clientY - state.y;
        } else if (e.touches.length === 2) {
            state.lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
    });

    frameLayer.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
            state.x = e.touches[0].clientX - state.lastX;
            state.y = e.touches[0].clientY - state.lastY;
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            state.scale *= (dist / state.lastDist);
            state.lastDist = dist;
        }
        updateTransform();
    }, { passive: false });

    function updateTransform() {
        frameLayer.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    }

    exposureSlider.addEventListener('input', (e) => {
        if (videoTrack) videoTrack.applyConstraints({ advanced: [{ exposureCompensation: parseFloat(e.target.value) }] });
    });

    // 3. 撮影 & 合成 (JPEG)
    document.getElementById('shutter').addEventListener('click', () => {
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // ビデオの実際の表示サイズと位置（object-fit: containを考慮）
        const vW = video.offsetWidth;
        const vH = video.offsetHeight;
        const rect = video.getBoundingClientRect();
        
        // 映像が実際に描画されている範囲を特定
        const videoRatio = canvas.width / canvas.height;
        const elementRatio = vW / vH;
        let realW, realH, realX, realY;

        if (elementRatio > videoRatio) {
            realH = vH;
            realW = vH * videoRatio;
        } else {
            realW = vW;
            realH = vW / videoRatio;
        }
        realX = rect.left + (vW - realW) / 2;
        realY = rect.top + (vH - realH) / 2;

        // 合成用スケール
        const s = canvas.width / realW;

        // 描画開始
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (frameImg.src && frameLayer.style.display !== 'none') {
            const drawX = (state.x - realX) * s;
            const drawY = (state.y - realY) * s;
            const drawW = (frameImg.naturalWidth * state.scale) * s;
            const drawH = (frameImg.naturalHeight * state.scale) * s;
            ctx.drawImage(frameImg, drawX, drawY, drawW, drawH);
        }

        // JPEGとして保存 (品質 0.9)
        const link = document.createElement('a');
        link.download = `photo-${Date.now()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    });

    window.onload = startCamera;
</script>
</body>
</html>
