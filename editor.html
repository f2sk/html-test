<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Touch Optimized Editor</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --bg: #1a1a1a; }
        body { font-family: sans-serif; text-align: center; background: var(--bg); color: #fff; margin: 0; padding: 10px; touch-action: none; overflow: hidden; }
        
        /* ボタンのデザイン統一 */
        .big-btn { 
            display: block; width: 100%; max-width: 500px; margin: 0 auto 15px;
            padding: 15px 0; font-size: 16px; font-weight: bold; color: white;
            background: var(--primary); border: none; border-radius: 10px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .save-btn { background: var(--success); margin-top: 10px; }
        input[type="file"] { display: none; } /* デフォルトのボタンは隠す */

        .controls { background: #333; padding: 15px; border-radius: 12px; max-width: 500px; margin: 0 auto 10px; display: flex; flex-direction: column; gap: 10px; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
        input[type="range"] { flex-grow: 1; height: 30px; accent-color: var(--primary); }
        
        .btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        button.tool { padding: 10px 2px; border: none; border-radius: 6px; background: #555; color: white; font-size: 11px; font-weight: bold; }
        button.active { background: var(--primary); }

        .canvas-area { position: relative; display: inline-block; margin-top: 5px; line-height: 0; background: #333; border-radius: 4px; overflow: hidden; }
        canvas { max-width: 100%; height: auto; display: block; }
        
        /* 切り抜きガイド - 当たり判定を広く */
        #crop-guide {
            position: absolute; border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 0 0 9999px rgba(0,0,0,0.6);
            display: none; box-sizing: border-box; cursor: move;
        }
        /* 当たり判定を広げたハンドル（透明だが触れる） */
        .handle { position: absolute; background: transparent; }
        .h-top    { top: -20px; left: 0; right: 0; height: 40px; cursor: ns-resize; }
        .h-bottom { bottom: -20px; left: 0; right: 0; height: 40px; cursor: ns-resize; }
        .h-left   { left: -20px; top: 0; bottom: 0; width: 40px; cursor: ew-resize; }
        .h-right  { right: -20px; top: 0; bottom: 0; width: 40px; cursor: ew-resize; }
        
        /* 視覚的なガイド線（ハンドルの中心に表示） */
        .line-v { position: absolute; background: white; width: 100%; height: 2px; top: 50%; left: 0; opacity: 0.5; }
        .line-h { position: absolute; background: white; height: 100%; width: 2px; left: 50%; top: 0; opacity: 0.5; }
    </style>
</head>
<body>

    <!-- 大きくなったファイル選択ボタン -->
    <label class="big-btn">
        画像を選択する
        <input type="file" id="upload" accept="image/*">
    </label>

    <div class="controls">
        <div class="row">
            <select id="color-mode" style="background:#444; color:#fff; border:none; padding:8px; border-radius:4px;">
                <option value="green">緑除去</option>
                <option value="blue">青除去</option>
            </select>
            <input type="range" id="threshold" min="0" max="200" value="50">
        </div>
        <div class="row">
            <label>微回転</label>
            <input type="range" id="fine-rotate" min="-180" max="180" value="0">
            <span id="angle-val" style="width:35px">0°</span>
        </div>
        <div class="btn-group">
            <button class="tool" onclick="addRotate(-90)">-90°</button>
            <button class="tool" onclick="addRotate(90)">+90°</button>
            <button class="tool" id="crop-mode-btn" onclick="toggleCropMode()">枠を表示</button>
            <button class="tool" id="exec-crop-btn" style="display:none; background: var(--primary);" onclick="executeCrop()">切抜実行</button>
        </div>
        <button class="big-btn save-btn" onclick="saveImage()">透過PNGとして保存</button>
    </div>

    <div class="canvas-area" id="container">
        <canvas id="canvas"></canvas>
        <div id="crop-guide">
            <div class="handle h-top" data-dir="t"><div class="line-v"></div></div>
            <div class="handle h-bottom" data-dir="b"><div class="line-v"></div></div>
            <div class="handle h-left" data-dir="l"><div class="line-h"></div></div>
            <div class="handle h-right" data-dir="r"><div class="line-h"></div></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const guide = document.getElementById('crop-guide');
        const fineRotate = document.getElementById('fine-rotate');
        const angleVal = document.getElementById('angle-val');
        
        let rawImg = new Image();
        let baseRotation = 0;
        let isCropMode = false;
        let cropRect = { x: 50, y: 50, w: 150, h: 150 };

        document.getElementById('upload').onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (f) => {
                rawImg.onload = () => {
                    baseRotation = 0;
                    fineRotate.value = 0;
                    angleVal.textContent = "0°";
                    render();
                };
                rawImg.src = f.target.result;
            };
            reader.readAsDataURL(file);
        };

        function addRotate(deg) {
            baseRotation = (baseRotation + deg) % 360;
            render();
        }

        fineRotate.oninput = () => {
            angleVal.textContent = fineRotate.value + "°";
            render();
        };

        document.getElementById('threshold').oninput = render;
        document.getElementById('color-mode').onchange = render;

        function render() {
            if (!rawImg.src) return;
            const totalRad = (baseRotation + parseInt(fineRotate.value)) * Math.PI / 180;

            const absCos = Math.abs(Math.cos(totalRad));
            const absSin = Math.abs(Math.sin(totalRad));
            canvas.width = rawImg.width * absCos + rawImg.height * absSin;
            canvas.height = rawImg.width * absSin + rawImg.height * absCos;

            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(totalRad);
            ctx.drawImage(rawImg, -rawImg.width / 2, -rawImg.height / 2);
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            applyChromaKey();
            if (isCropMode) updateGuideDOM();
        }

        function applyChromaKey() {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const t = parseInt(document.getElementById('threshold').value);
            const mode = document.getElementById('color-mode').value;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i+1], b = data[i+2];
                let diff = (mode === 'green') ? (g - (r + b) / 2) : (b - (r + g) / 2);
                if (diff > t) data[i + 3] = 0;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function toggleCropMode() {
            isCropMode = !isCropMode;
            guide.style.display = isCropMode ? 'block' : 'none';
            document.getElementById('exec-crop-btn').style.display = isCropMode ? 'inline-block' : 'none';
            document.getElementById('crop-mode-btn').classList.toggle('active');
            if (isCropMode) {
                const rect = canvas.getBoundingClientRect();
                cropRect = { x: rect.width*0.1, y: rect.height*0.1, w: rect.width*0.8, h: rect.height*0.8 };
                updateGuideDOM();
            }
        }

        function updateGuideDOM() {
            guide.style.left = cropRect.x + "px";
            guide.style.top = cropRect.y + "px";
            guide.style.width = cropRect.w + "px";
            guide.style.height = cropRect.h + "px";
        }

        let activeAction = null;
        let startPos = { x: 0, y: 0, rx: 0, ry: 0, rw: 0, rh: 0 };

        const getEvPos = (e) => ({ 
            x: e.touches ? e.touches[0].clientX : e.clientX, 
            y: e.touches ? e.touches[0].clientY : e.clientY 
        });

        const onStart = (e) => {
            const pos = getEvPos(e);
            // ハンドルかガイド自体か判定
            activeAction = e.target.closest('.handle')?.dataset.dir || (e.target === guide ? 'move' : null);
            if (!activeAction) return;
            
            e.preventDefault();
            startPos = { x: pos.x, y: pos.y, ...cropRect };
        };

        const onMove = (e) => {
            if (!activeAction) return;
            const pos = getEvPos(e);
            const dx = pos.x - startPos.x;
            const dy = pos.y - startPos.y;

            if (activeAction === 'move') {
                cropRect.x = startPos.rx + dx;
                cropRect.y = startPos.ry + dy;
            } else {
                if (activeAction === 't') { cropRect.y = startPos.ry + dy; cropRect.h = startPos.rh - dy; }
                if (activeAction === 'b') { cropRect.h = startPos.rh + dy; }
                if (activeAction === 'l') { cropRect.x = startPos.rx + dx; cropRect.w = startPos.rw - dx; }
                if (activeAction === 'r') { cropRect.w = startPos.rw + dx; }
            }
            updateGuideDOM();
        };

        const onEnd = () => activeAction = null;

        guide.addEventListener('touchstart', onStart, {passive: false});
        guide.addEventListener('mousedown', onStart);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchend', onEnd);
        window.addEventListener('mouseup', onEnd);

        function executeCrop() {
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            const x = cropRect.x * scale;
            const y = cropRect.y * scale;
            const w = cropRect.w * scale;
            const h = cropRect.h * scale;

            const temp = document.createElement('canvas');
            temp.width = w; temp.height = h;
            temp.getContext('2d', { willReadFrequently: true }).putImageData(ctx.getImageData(x, y, w, h), 0, 0);

            rawImg.src = temp.toDataURL();
            baseRotation = 0;
            fineRotate.value = 0;
            toggleCropMode();
        }

        function saveImage() {
            const link = document.createElement('a');
            link.download = 'edited.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        }
    </script>
</body>
</html>
