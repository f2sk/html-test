<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Image Editor</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; margin: 0; padding: 20px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; max-width: 500px; margin-inline: auto; }
        button { padding: 12px; font-size: 14px; cursor: pointer; border: none; border-radius: 8px; background: #007bff; color: white; }
        button:active { background: #0056b3; }
        .save-btn { background: #28a745; grid-column: span 2; }
        canvas { max-width: 100%; height: auto; border: 2px solid #ccc; background-image: 
            linear-gradient(45deg, #ddd 25%, transparent 25%), linear-gradient(-45deg, #ddd 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #ddd 75%), linear-gradient(-45deg, transparent 75%, #ddd 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
    </style>
</head>
<body>

    <h2>JS画像エディタ</h2>
    
    <input type="file" id="upload" accept="image/*" style="margin-bottom: 20px;"><br>

    <div class="controls">
        <button onclick="rotateImage()">90度回転</button>
        <button onclick="removeGreen()">グリーンバック除去</button>
        <button class="save-btn" onclick="saveImage()">透過PNGとして保存</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let img = new Image();

        // 画像の読み込み
        document.getElementById('upload').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        // 回転処理
        function rotateImage() {
            const oldWidth = canvas.width;
            const oldHeight = canvas.height;
            const imageData = ctx.getImageData(0, 0, oldWidth, oldHeight);

            // 一時的なキャンバスに退避
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = oldWidth;
            tempCanvas.height = oldHeight;
            tempCanvas.getContext('2d').putImageData(imageData, 0, 0);

            // メインキャンバスのサイズを入れ替え
            canvas.width = oldHeight;
            canvas.height = oldWidth;

            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(90 * Math.PI / 180);
            ctx.drawImage(tempCanvas, -oldWidth / 2, -oldHeight / 2);
        }

        // グリーンバック除去 (クロマキー)
        function removeGreen() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // 緑色の判定ロジック (GがRとBより一定以上大きい場合)
                if (g > 100 && g > r * 1.2 && g > b * 1.2) {
                    data[i + 3] = 0; // アルファ値を0にして透過
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // 保存処理
        function saveImage() {
            const link = document.createElement('a');
            link.download = 'edited-image.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        }
    </script>
</body>
</html>
