<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrollable Image Editor</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --bg: #1a1a1a; }
        
        /* スクロールを許可するように修正 */
        body { 
            font-family: sans-serif; text-align: center; background: var(--bg); color: #fff; 
            margin: 0; padding: 0; overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        
        /* 操作パネルを上部に固定 */
        .ui-panel {
            position: sticky; top: 0; z-index: 1000;
            background: #333; padding: 10px; border-bottom: 2px solid #444;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .big-btn { 
            display: block; width: 95%; max-width: 500px; margin: 5px auto;
            padding: 15px 0; font-size: 16px; font-weight: bold; color: white;
            background: var(--primary); border: none; border-radius: 10px; cursor: pointer;
        }
        .save-btn { background: var(--success); }
        input[type="file"] { display: none; }

        .controls { 
            background: #444; padding: 12px; border-radius: 10px; 
            max-width: 500px; margin: 5px auto; display: flex; flex-direction: column; gap: 8px; 
        }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
        input[type="range"] { flex-grow: 1; height: 30px; accent-color: var(--primary); }
        
        .btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        button.tool { padding: 10px 2px; border: none; border-radius: 6px; background: #555; color: white; font-size: 11px; font-weight: bold; }
        button.active { background: var(--primary); }

        /* キャンバスエリア */
        .canvas-area { 
            position: relative; display: inline-block; margin: 20px 0; 
            line-height: 0; background: #222; border-radius: 4px;
        }
        
        /* Canvas上だけブラウザのスクロール（ジェスチャー）を無効化 */
        canvas { 
            max-width: 100%; height: auto; display: block; touch-action: none; 
            background-image: linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 20px 20px;
        }
        
        /* 下部に余白を持たせる（スクロールしきれるように） */
        .footer-spacer { height: 100px; }
    </style>
</head>
<body>

    <div class="ui-panel">
        <label class="big-btn">
            画像を選択する (PNG/JPG)
            <input type="file" id="upload" accept="image/png, image/jpeg, image/jpg">
        </label>

        <div class="controls">
            <div class="row">
                <select id="color-mode" style="background:#222; color:#fff; border:none; padding:8px; border-radius:4px;">
                    <option value="green">緑除去</option>
                    <option value="blue">青除去</option>
                    <option value="black">黒除去</option>
                </select>
                <input type="range" id="threshold" min="0" max="255" value="50">
            </div>
            <div class="row">
                <label>微回転</label>
                <input type="range" id="fine-rotate" min="-180" max="180" value="0">
                <span id="angle-val" style="width:35px">0°</span>
            </div>
            <div class="btn-group">
                <button class="tool" onclick="setFixedRotate(-90)">-90°</button>
                <button class="tool" onclick="setFixedRotate(90)">+90°</button>
                <button class="tool" id="crop-mode-btn" onclick="toggleCropMode()">枠を表示</button>
                <button class="tool" id="exec-crop-btn" style="display:none; background: var(--primary);" onclick="executeCrop()">切抜実行</button>
            </div>
        </div>
    </div>

    <div class="canvas-area">
        <canvas id="canvas"></canvas>
    </div>
    
    <button class="big-btn save-btn" onclick="saveImage()">透過PNGとして保存</button>
    <div class="footer-spacer"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let rawImg = new Image();
        let baseFixedRotation = 0;
        let isCropMode = false;
        let cropRect = { x: 50, y: 50, w: 200, h: 200 };
        
        const HANDLE_TARGET_RADIUS = 35; // 縦長画像でも触りやすいよう少し拡大
        const HANDLE_DRAW_RADIUS = 8;
        let activeHandle = null;
        let lastTouch = { x: 0, y: 0 };

        document.getElementById('upload').onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (f) => {
                rawImg.onload = () => {
                    baseFixedRotation = 0;
                    document.getElementById('fine-rotate').value = 0;
                    document.getElementById('angle-val').textContent = "0°";
                    render();
                    resetCropRect();
                    render();
                };
                rawImg.src = f.target.result;
            };
            reader.readAsDataURL(file);
        };

        function resetCropRect() {
            if (!rawImg.src) return;
            const margin = Math.min(canvas.width, canvas.height) * 0.1;
            cropRect = {
                x: margin, y: margin,
                w: canvas.width - margin * 2,
                h: canvas.height - margin * 2
            };
        }

        function setFixedRotate(deg) {
            document.getElementById('fine-rotate').value = 0;
            document.getElementById('angle-val').textContent = "0°";
            baseFixedRotation = (baseFixedRotation + deg) % 360;
            if (baseFixedRotation < 0) baseFixedRotation += 360;
            render();
            resetCropRect();
            render();
        }

        document.getElementById('fine-rotate').oninput = (e) => {
            document.getElementById('angle-val').textContent = e.target.value + "°";
            render();
        };

        document.getElementById('threshold').oninput = render;
        document.getElementById('color-mode').onchange = render;

        function render() {
            if (!rawImg.src) return;
            const fineDeg = parseInt(document.getElementById('fine-rotate').value);
            const totalDeg = baseFixedRotation + fineDeg;
            const totalRad = totalDeg * Math.PI / 180;

            const absCos = Math.abs(Math.cos(totalRad));
            const absSin = Math.abs(Math.sin(totalRad));
            canvas.width = rawImg.width * absCos + rawImg.height * absSin;
            canvas.height = rawImg.width * absSin + rawImg.height * absCos;

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(totalRad);
            ctx.drawImage(rawImg, -rawImg.width / 2, -rawImg.height / 2);
            ctx.restore();

            applyChromaKey();
            if (isCropMode) drawCropUI();
        }

        function applyChromaKey() {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const t = parseInt(document.getElementById('threshold').value);
            const mode = document.getElementById('color-mode').value;

            let target = { r: 0, g: 255, b: 0 };
            if (mode === 'blue') target = { r: 0, g: 0, b: 255 };
            if (mode === 'black') target = { r: 0, g: 0, b: 0 };

            for (let i = 0; i < data.length; i += 4) {
                const dist = Math.max(Math.abs(data[i]-target.r), Math.abs(data[i+1]-target.g), Math.abs(data[i+2]-target.b));
                if (dist < t) data[i + 3] = 0;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function drawCropUI() {
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(0, 0, canvas.width, cropRect.y);
            ctx.fillRect(0, cropRect.y + cropRect.h, canvas.width, canvas.height - (cropRect.y + cropRect.h));
            ctx.fillRect(0, cropRect.y, cropRect.x, cropRect.h);
            ctx.fillRect(cropRect.x + cropRect.w, cropRect.y, canvas.width - (cropRect.x + cropRect.w), cropRect.h);
            ctx.lineWidth = 2; ctx.strokeStyle = "#fff";
            ctx.strokeRect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);

            const handles = [
                {x: cropRect.x, y: cropRect.y, id:'tl'},
                {x: cropRect.x+cropRect.w, y: cropRect.y, id:'tr'},
                {x: cropRect.x+cropRect.w, y: cropRect.y+cropRect.h, id:'br'},
                {x: cropRect.x, y: cropRect.y+cropRect.h, id:'bl'}
            ];
            ctx.fillStyle = "#007bff"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
            handles.forEach(h => {
                ctx.beginPath(); ctx.arc(h.x, h.y, HANDLE_DRAW_RADIUS, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            });
        }

        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function onStart(e) {
            if (!isCropMode) return;
            const pos = getCanvasPos(e);
            activeHandle = null;
            const handles = [
                {x: cropRect.x, y: cropRect.y, id:'tl'},
                {x: cropRect.x+cropRect.w, y: cropRect.y, id:'tr'},
                {x: cropRect.x+cropRect.w, y: cropRect.y+cropRect.h, id:'br'},
                {x: cropRect.x, y: cropRect.y+cropRect.h, id:'bl'}
            ];
            for (let h of handles) {
                if (Math.sqrt((pos.x-h.x)**2 + (pos.y-h.y)**2) < HANDLE_TARGET_RADIUS) {
                    activeHandle = h.id; break;
                }
            }
            if (activeHandle) {
                e.preventDefault(); // 隅を掴んでいる時だけスクロールを阻止
                lastTouch = pos;
            }
        }

        function onMove(e) {
            if (!isCropMode || !activeHandle) return;
            e.preventDefault();
            const pos = getCanvasPos(e);
            const dx = pos.x - lastTouch.x;
            const dy = pos.y - lastTouch.y;

            if (activeHandle === 'tl') { cropRect.x += dx; cropRect.y += dy; cropRect.w -= dx; cropRect.h -= dy; }
            else if (activeHandle === 'tr') { cropRect.y += dy; cropRect.w += dx; cropRect.h -= dy; }
            else if (activeHandle === 'br') { cropRect.w += dx; cropRect.h += dy; }
            else if (activeHandle === 'bl') { cropRect.x += dx; cropRect.w -= dx; cropRect.h += dy; }

            cropRect.w = Math.max(10, cropRect.w); cropRect.h = Math.max(10, cropRect.h);
            lastTouch = pos;
            render();
        }

        function onEnd() { activeHandle = null; }

        canvas.addEventListener('touchstart', onStart, {passive: false});
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onEnd);
        canvas.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        function toggleCropMode() {
            isCropMode = !isCropMode;
            document.getElementById('exec-crop-btn').style.display = isCropMode ? 'inline-block' : 'none';
            document.getElementById('crop-mode-btn').classList.toggle('active');
            if (isCropMode) resetCropRect();
            render();
        }

        function executeCrop() {
            isCropMode = false; render();
            const temp = document.createElement('canvas');
            temp.width = cropRect.w; temp.height = cropRect.h;
            temp.getContext('2d').putImageData(ctx.getImageData(cropRect.x, cropRect.y, cropRect.w, cropRect.h), 0, 0);
            rawImg.src = temp.toDataURL();
            baseFixedRotation = 0;
            document.getElementById('fine-rotate').value = 0;
            document.getElementById('angle-val').textContent = "0°";
            document.getElementById('exec-crop-btn').style.display = 'none';
            document.getElementById('crop-mode-btn').classList.remove('active');
        }

        function saveImage() {
            if (isCropMode) { isCropMode = false; render(); }
            const link = document.createElement('a');
            link.download = 'edited.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        }
    </script>
</body>
</html>
