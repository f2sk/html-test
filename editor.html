<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Robust Canvas Editor</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --bg: #1a1a1a; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .ui-panel { padding: 10px; background: #333; z-index: 10; flex-shrink: 0; }
        .big-btn { 
            display: block; width: 100%; max-width: 400px; margin: 5px auto;
            padding: 12px; font-size: 15px; font-weight: bold; color: white;
            background: var(--primary); border: none; border-radius: 8px; text-align: center;
        }
        .save-btn { background: var(--success); }
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 5px; }
        .tool-btn { padding: 8px 12px; border: none; border-radius: 5px; background: #555; color: white; font-size: 12px; }
        .active { background: var(--primary) !important; }

        .editor-container { flex-grow: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
        canvas { max-width: 100%; max-height: 100%; touch-action: none; background: #222; }
    </style>
</head>
<body>

    <div class="ui-panel">
        <label class="big-btn">画像を選択<input type="file" id="upload" accept="image/*" style="display:none"></label>
        <div class="controls">
            <select id="color-mode" style="background:#444; color:#fff; border:none; padding:5px;">
                <option value="green">緑除去</option><option value="blue">青除去</option>
            </select>
            <input type="range" id="threshold" min="0" max="200" value="50">
            <button class="tool-btn" onclick="addRotate(-90)">-90°</button>
            <button class="tool-btn" onclick="addRotate(90)">+90°</button>
            <button class="tool-btn" id="crop-toggle" onclick="toggleCrop()">切抜枠</button>
            <button class="tool-btn" id="exec-crop" style="display:none; background:var(--primary)" onclick="executeCrop()">実行</button>
        </div>
        <button class="big-btn save-btn" onclick="saveImage()">透過PNG保存</button>
    </div>

    <div class="editor-container">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let img = new Image();
        let rotation = 0;
        let isCropMode = false;
        
        // 切り抜き枠（Canvas上の座標）
        let crop = { x: 50, y: 50, w: 200, h: 200 };
        const HANDLE_RADIUS = 25; // タッチしやすいよう半径を大きく（描画は小さく）
        let dragTarget = null; // 'tl', 'tr', 'bl', 'br', 'move'
        let lastTouch = { x: 0, y: 0 };

        document.getElementById('upload').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (f) => { img.onload = () => { rotation = 0; resetCrop(); render(); }; img.src = f.target.result; };
            reader.readAsDataURL(e.target.files[0]);
        };

        function resetCrop() {
            const margin = canvas.width * 0.1;
            crop = { x: margin, y: margin, w: canvas.width * 0.8, h: canvas.height * 0.8 };
        }

        function addRotate(deg) { rotation = (rotation + deg) % 360; render(); }
        document.getElementById('threshold').oninput = render;

        function render() {
            if (!img.src) return;
            const rad = rotation * Math.PI / 180;
            const s = Math.abs(Math.sin(rad)), c = Math.abs(Math.cos(rad));
            canvas.width = img.width * c + img.height * s;
            canvas.height = img.width * s + img.height * c;

            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.rotate(rad);
            ctx.drawImage(img, -img.width/2, -img.height/2);
            ctx.restore();

            applyChromaKey();
            if (isCropMode) drawCropUI();
        }

        function applyChromaKey() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const t = document.getElementById('threshold').value;
            const isGreen = document.getElementById('color-mode').value === 'green';

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i+1], b = data[i+2];
                const diff = isGreen ? g - (r + b) / 2 : b - (r + g) / 2;
                if (diff > t) data[i+3] = 0;
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function drawCropUI() {
            // 暗転
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(0,0,canvas.width, crop.y); // 上
            ctx.fillRect(0, crop.y + crop.h, canvas.width, canvas.height - (crop.y + crop.h)); // 下
            ctx.fillRect(0, crop.y, crop.x, crop.h); // 左
            ctx.fillRect(crop.x + crop.w, crop.y, canvas.width - (crop.x + crop.w), crop.h); // 右

            // 枠線
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.strokeRect(crop.x, crop.y, crop.w, crop.h);

            // 四隅のハンドル
            const corners = [
                {x: crop.x, y: crop.y}, // tl
                {x: crop.x + crop.w, y: crop.y}, // tr
                {x: crop.x, y: crop.y + crop.h}, // bl
                {x: crop.x + crop.w, y: crop.y + crop.h} // br
            ];
            ctx.fillStyle = "#fff";
            corners.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, 8, 0, Math.PI*2); // 見た目は小さく
                ctx.fill();
            });
        }

        // --- 座標検知ロジック ---
        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function onStart(e) {
            if (!isCropMode) return;
            const pos = getCanvasPos(e);
            lastTouch = pos;

            const dist = (x1, y1, x2, y2) => Math.sqrt((x1-x2)**2 + (y1-y2)**2);

            if (dist(pos.x, pos.y, crop.x, crop.y) < HANDLE_RADIUS) dragTarget = 'tl';
            else if (dist(pos.x, pos.y, crop.x + crop.w, crop.y) < HANDLE_RADIUS) dragTarget = 'tr';
            else if (dist(pos.x, pos.y, crop.x, crop.y + crop.h) < HANDLE_RADIUS) dragTarget = 'bl';
            else if (dist(pos.x, pos.y, crop.x + crop.w, crop.y + crop.h) < HANDLE_RADIUS) dragTarget = 'br';
            else if (pos.x > crop.x && pos.x < crop.x + crop.w && pos.y > crop.y && pos.y < crop.y + crop.h) dragTarget = 'move';
            
            if (dragTarget) e.preventDefault();
        }

        function onMove(e) {
            if (!dragTarget) return;
            e.preventDefault();
            const pos = getCanvasPos(e);
            const dx = pos.x - lastTouch.x;
            const dy = pos.y - lastTouch.y;

            if (dragTarget === 'tl') { crop.x += dx; crop.y += dy; crop.w -= dx; crop.h -= dy; }
            else if (dragTarget === 'tr') { crop.y += dy; crop.w += dx; crop.h -= dy; }
            else if (dragTarget === 'bl') { crop.x += dx; crop.w -= dx; crop.h += dy; }
            else if (dragTarget === 'br') { crop.w += dx; crop.h += dy; }
            else if (dragTarget === 'move') { crop.x += dx; crop.y += dy; }

            lastTouch = pos;
            render();
        }

        function onEnd() { dragTarget = null; }

        canvas.addEventListener('touchstart', onStart, {passive: false});
        window.addEventListener('touchmove', onMove, {passive: false});
        window.addEventListener('touchend', onEnd);
        canvas.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        function toggleCrop() {
            isCropMode = !isCropMode;
            document.getElementById('crop-toggle').classList.toggle('active');
            document.getElementById('exec-crop').style.display = isCropMode ? 'inline-block' : 'none';
            render();
        }

        function executeCrop() {
            const temp = document.createElement('canvas');
            temp.width = crop.w; temp.height = crop.h;
            temp.getContext('2d').putImageData(ctx.getImageData(crop.x, crop.y, crop.w, crop.h), 0, 0);
            img.src = temp.toDataURL();
            rotation = 0;
            toggleCrop();
        }

        function saveImage() {
            const link = document.createElement('a');
            link.download = "edit.png";
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
