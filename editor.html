<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Image Editor</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; margin: 0; padding: 10px; }
        .controls { background: #333; padding: 15px; border-radius: 12px; max-width: 500px; margin: 0 auto 10px; display: flex; flex-direction: column; gap: 10px; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
        input[type="range"] { flex-grow: 1; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        button { padding: 10px 5px; border: none; border-radius: 6px; background: #444; color: white; font-size: 12px; cursor: pointer; }
        button.primary { background: #007bff; }
        button.success { background: #28a745; }
        
        .canvas-container { position: relative; display: inline-block; margin-top: 10px; line-height: 0; }
        canvas { 
            max-width: 100%; height: auto; border: 1px solid #555;
            background-image: linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%),
                              linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 20px 20px; background-color: #444;
        }
        /* 切り抜きガイド枠 */
        #crop-guide {
            position: absolute; border: 2px dashed #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
            pointer-events: none; display: none; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <input type="file" id="upload" accept="image/*" style="margin-bottom: 10px;">

    <div class="controls">
        <div class="row">
            <label>緑除去</label>
            <input type="range" id="threshold" min="0" max="200" value="50">
        </div>
        <div class="row">
            <label>枠サイズ</label>
            <input type="range" id="crop-size" min="10" max="100" value="80">
        </div>
        <div class="btn-group">
            <button onclick="rotateImage()">90度回転</button>
            <button id="crop-btn" class="primary" onclick="toggleCropMode()">切り抜き枠</button>
            <button id="exec-crop" class="primary" style="display:none;" onclick="executeCrop()">実行</button>
            <button class="success" onclick="saveImage()">PNG保存</button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="canvas"></canvas>
        <div id="crop-guide"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const guide = document.getElementById('crop-guide');
        const thresholdInput = document.getElementById('threshold');
        const cropSizeInput = document.getElementById('crop-size');
        
        let originalImageData = null;
        let isCropMode = false;

        // 画像読み込み
        document.getElementById('upload').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (f) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    saveState();
                    applyChromaKey();
                };
                img.src = f.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        function saveState() {
            originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        }

        // グリーンバック除去
        thresholdInput.addEventListener('input', applyChromaKey);
        function applyChromaKey() {
            if (!originalImageData) return;
            const newImgData = new ImageData(new Uint8ClampedArray(originalImageData.data), originalImageData.width, originalImageData.height);
            const data = newImgData.data;
            const t = parseInt(thresholdInput.value);
            for (let i = 0; i < data.length; i += 4) {
                if (data[i+1] - (data[i] + data[i+2])/2 > t) data[i+3] = 0;
            }
            ctx.putImageData(newImgData, 0, 0);
        }

        // 切り抜きモード切替
        function toggleCropMode() {
            isCropMode = !isCropMode;
            guide.style.display = isCropMode ? 'block' : 'none';
            document.getElementById('exec-crop').style.display = isCropMode ? 'inline-block' : 'none';
            document.getElementById('crop-btn').textContent = isCropMode ? 'キャンセル' : '切り抜き枠';
            if (isCropMode) updateCropGuide();
        }

        cropSizeInput.addEventListener('input', updateCropGuide);
        function updateCropGuide() {
            if (!isCropMode) return;
            const rect = canvas.getBoundingClientRect();
            const percent = cropSizeInput.value / 100;
            const size = Math.min(rect.width, rect.height) * percent;
            guide.style.width = size + 'px';
            guide.style.height = size + 'px';
            guide.style.top = (rect.height - size) / 2 + 'px';
            guide.style.left = (rect.width - size) / 2 + 'px';
        }

        // 切り抜き実行
        function executeCrop() {
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            const size = parseFloat(guide.style.width) * scale;
            const x = (canvas.width - size) / 2;
            const y = (canvas.height - size) / 2;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = size;
            tempCanvas.height = size;
            tempCanvas.getContext('2d').putImageData(ctx.getImageData(x, y, size, size), 0, 0);

            canvas.width = size;
            canvas.height = size;
            ctx.drawImage(tempCanvas, 0, 0);
            
            saveState();
            toggleCropMode();
        }

        function rotateImage() {
            const temp = document.createElement('canvas');
            temp.width = canvas.height; temp.height = canvas.width;
            const tCtx = temp.getContext('2d');
            tCtx.translate(temp.width/2, temp.height/2);
            tCtx.rotate(Math.PI/2);
            tCtx.drawImage(canvas, -canvas.width/2, -canvas.height/2);
            canvas.width = temp.width; canvas.height = temp.height;
            ctx.drawImage(temp, 0, 0);
            saveState();
        }

        function saveImage() {
            const link = document.createElement('a');
            link.download = 'crop_edit.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
